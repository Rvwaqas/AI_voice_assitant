[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for AI Voice Assistant using OpenAI Agents SDK & Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai-agents>=0.0.8",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.6.0",
    "duckduckgo-search>=6.3.0",
    "edge-tts>=6.1.12",
    "python-multipart>=0.0.12",
]
